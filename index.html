<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바우처 매치</title>
<meta name="description" content="참가신청서 정보로 수출 지원 바우처 서비스 유형과 이유를 추천하는 과제용 화면 목업">
<link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="nav">
  <div class="container">
    <a class="logo" href="#" data-act="home" aria-label="바우처 매치 홈">
      <span class="logo-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>바우처 매치
    </a>
    <ul class="menu" aria-label="주 메뉴">
      <li><a href="#" aria-current="page" data-act="menu-active">맞춤 추천</a></li>
      <li><a href="#" data-act="menu-soon">서비스 찾기</a></li>
      <li><a href="#" data-act="menu-soon">이용 계획</a></li>
      <li><a href="#" data-act="menu-soon">진행 현황</a></li>
    </ul>
    <div class="nav-right">
      <button type="button" class="switch" id="evalToggle" role="switch" aria-checked="false">
        <span class="track" aria-hidden="true"></span><span>평가자 보기</span>
      </button>
      <button type="button" class="icon-btn" data-act="menu-soon" aria-label="알림">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
      </button>
      <div class="profile-chip"><span class="avatar" aria-hidden="true">CO</span><span class="who" id="navWho"></span></div>
    </div>
  </div>
</header>

<div class="container page">
  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero-top">
      <div>
        <h1 id="heroTitle"></h1>
        <p class="lead">참가신청서와 통관 기록으로 계산했어요. 다시 입력할 필요 없어요</p>
      </div>
      <div class="hero-side">
        <div class="counts" id="counts" aria-live="polite"></div>
        <button type="button" class="btn" data-act="guide">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.4"/></svg>추천 기준 안내
        </button>
      </div>
    </div>
    <ol class="ladder" id="ladder" aria-label="성장단계"></ol>
  </section>

  <div class="alerts" id="alerts"></div>

  <div class="layout">
    <aside class="side" aria-label="회사 정보와 확인 질문">
      <section class="card profile" id="profile" aria-label="회사 프로필"></section>
      <section class="card qcard" id="questions" aria-labelledby="qTitle"></section>
    </aside>

    <main class="main" id="main">
      <section class="section" aria-labelledby="recTitle">
        <div class="section-head"><h2 id="recTitle">추천 서비스 유형</h2><span class="hint">꼭 필요한 것부터, 지금 단계에 필요한 순서로 보여드려요</span></div>
        <div class="rec-list" id="recs"></div>
      </section>

      <section class="section" id="checkSec" aria-labelledby="checkTitle">
        <div class="section-head"><h2 id="checkTitle">확인하면 추천에 포함될 수 있는 유형</h2><span class="hint" id="checkHint"></span></div>
        <div class="check-grid" id="checks"></div>
      </section>

      <details class="more section" id="moreSec">
        <summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>더 보기 <span class="hint" id="moreHint"></span></summary>
        <div class="mini-grid" id="more"></div>
      </details>

      <section class="section" id="hiddenSec" aria-labelledby="hiddenTitle" hidden>
        <div class="section-head"><h2 id="hiddenTitle">보유 중으로 표시한 유형</h2><span class="hint">다시 추천에 넣으려면 ↺를 누르세요</span></div>
        <div class="hidden-types" id="hiddenTypes"></div>
      </section>

      <footer class="logic-footer eval-only" id="logicFooter"></footer>
    </main>
  </div>
</div>

<button type="button" class="fab" data-act="demo">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>시연 패널
</button>

<div class="cart" id="cart" aria-live="polite">
  <div class="container">
    <span class="cart-title" id="cartTitle"></span>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-actions">
      <button type="button" class="btn" data-act="noop">비교하기</button>
      <button type="button" class="btn primary" data-act="noop">이용 계획에 추가</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="demoDrawer" role="dialog" aria-modal="true" aria-labelledby="demoTitle" hidden>
  <div class="drawer-head">
    <h2 id="demoTitle">시연 패널</h2>
    <button type="button" class="icon-btn" data-act="close" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="demoBody"></div>
</aside>

<aside class="drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="drawer-head">
    <h2 id="detailTitle">서비스 상세</h2>
    <button type="button" class="icon-btn" data-act="close" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="detailBody"></div>
  <div class="drawer-foot" id="detailFoot"></div>
</aside>

<div class="modal" id="guideModal" role="dialog" aria-modal="true" aria-labelledby="guideTitle" hidden>
  <div class="modal-box">
    <div class="drawer-head" style="padding:0;border:0">
      <h2 id="guideTitle">추천 기준 안내</h2>
      <button type="button" class="icon-btn" data-act="close" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ul class="guide" id="guideBody"></ul>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
